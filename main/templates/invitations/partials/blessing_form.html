{% load dw_tags %}
<form hx-post="{% url 'invitations:bless_create' event.slug %}"
      hx-target="{{ target|default:'#blessing-result' }}"
      hx-swap="innerHTML"
      class="mt-3 space-y-3">
  {% csrf_token %}
  {% for field in form %}
    {% include "invitations/partials/form_field.html" with field=field %}
  {% endfor %}
  <button type="submit" class="dw-btn dw-btn-gold dw-btn-block">{% t "bless_send" %}</button>
</form>
