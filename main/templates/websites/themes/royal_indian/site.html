{% extends "websites/site_base.html" %}
{% load dw_tags %}
{% comment %}Royal Indian — deep maroon velvet, antique gold filigree borders.{% endcomment %}

{% block head_extra %}
<style>
  body {
    background-image:
      radial-gradient(circle at 50% 0%, rgba(212,175,55,.16), transparent 46%),
      repeating-linear-gradient(45deg, rgba(212,175,55,.035) 0 2px, transparent 2px 9px);
  }
  .w-hero {
    border-bottom: 1px solid var(--w-border);
    box-shadow: inset 0 0 120px rgba(0,0,0,.45);
  }
  .w-hero__names { letter-spacing: .01em; }
  .w-card { box-shadow: 0 18px 40px -30px rgba(0,0,0,.9); }
  .w-btn { box-shadow: 0 8px 24px -14px rgba(212,175,55,.9); }
  .w-countdown__box { box-shadow: inset 0 0 0 1px rgba(212,175,55,.35); }
  .w-section--alt { background: var(--w-surface); border-block: 1px solid rgba(212,175,55,.22); }
</style>
{% endblock %}
