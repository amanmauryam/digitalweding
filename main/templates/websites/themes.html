{% extends "websites/base_editor.html" %}
{% load dw_tags %}

{% block editor_title %}{% t "site_theme_title" %}{% endblock %}
{% block editor_heading %}{% t "site_theme_title" %}{% endblock %}

{% block editor_content %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div class="grid gap-4 sm:grid-cols-2">
      {% for item in themes %}
        <label class="dw-card block cursor-pointer p-0 {% if selected == item.code %}ring-2 ring-sindoor{% endif %}">
          <input type="radio" name="theme" value="{{ item.code }}" class="sr-only"
                 {% if selected == item.code %}checked{% endif %}>
          <span class="block rounded-t-[18px] border-b border-ochre/40 px-4 py-3"
                style="background: {{ item.colors.bg }}; color: {{ item.colors.text }};">
            <span class="block font-display text-lg" style="font-family: {{ item.heading_font }};">{{ item.name }}</span>
            <span class="mt-1 block text-xs opacity-80" style="color: {{ item.colors.muted }};">{{ item.tagline }}</span>
            <span class="mt-3 flex gap-1.5">
              {% for colour in item.accents|slice:":4" %}
                <span class="inline-block h-4 w-4 rounded-full border border-black/20" style="background: {{ colour }};"></span>
              {% endfor %}
            </span>
          </span>
          <span class="block px-4 py-3 text-sm text-kalam/80">{{ item.description }}</span>
          {% if selected == item.code %}
            <span class="block border-t border-ochre/30 px-4 py-2 text-xs font-semibold text-sindoor">{% t "site_theme_selected" %}</span>
          {% endif %}
        </label>
      {% endfor %}
    </div>

    <button type="submit" class="dw-btn dw-btn-primary">{% t "site_save_continue" %}</button>
  </form>
{% endblock %}
